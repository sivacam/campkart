{% extends 'base.html' %}{% block title %}List an item · CAMPKART{% endblock %}{% block content %}<div class="form-page"><p class="eyebrow">SELL OR RENT</p><h1>Create a listing</h1><form method="post" enctype="multipart/form-data" class="form two"><label>Item name<input name="name" placeholder="Scientific calculator" required></label><label>Category<select name="category">{% for c in categories %}<option>{{c}}</option>{% endfor %}</select></label><label>Condition<select name="condition"><option>New</option><option selected>Good</option><option>Used</option></select></label><label>Listing type<select name="mode"><option value="sell">For sale</option><option value="rent">For rent</option></select></label><label>Sale price (₹)<input type="number" min="0" step="1" name="sale_price" placeholder="500"></label><label>Photo<input type="file" name="image" accept="image/*"></label><label>Rent / day (₹)<input type="number" min="0" step="1" name="rent_day" placeholder="5"></label><label>Rent / week (₹)<input type="number" min="0" step="1" name="rent_week" placeholder="20"></label><label>Rent / month (₹)<input type="number" min="0" step="1" name="rent_month" placeholder="50"></label><label class="full">Description<textarea name="description" rows="5" placeholder="Condition, included accessories, pickup details…" required></textarea></label><button class="btn full">Publish listing</button></form></div>{% endblock %}
